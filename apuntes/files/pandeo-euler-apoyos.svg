<svg viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'Cascadia Code',Consolas,monospace">
  <rect width="860" height="620" fill="#f7f0d9"/>
  <text x="30" y="42" fill="#0d2440" font-size="22" font-weight="bold">PANDEO DE EULER — longitud efectiva según apoyos</text>
  <text x="30" y="64" fill="#b64a2a" font-size="13">Pcr = π²·E·I / Le²   con   Le = K·L</text>

  <!-- suelo común -->
  <line x1="60" y1="480" x2="800" y2="480" stroke="#0d2440" stroke-width="2"/>

  <!-- Caso 1: biarticulada K=1 -->
  <g>
    <path d="M 130 480 Q 175 330 130 180" fill="none" stroke="#b64a2a" stroke-width="3"/>
    <line x1="130" y1="480" x2="130" y2="180" stroke="#0d2440" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="130" cy="480" r="6" fill="#f7f0d9" stroke="#0d2440" stroke-width="2"/>
    <circle cx="130" cy="180" r="6" fill="#f7f0d9" stroke="#0d2440" stroke-width="2"/>
    <path d="M 130 150 l -7 14 h 14 z" fill="#0d2440"/>
    <line x1="130" y1="120" x2="130" y2="150" stroke="#0d2440" stroke-width="2"/>
    <text x="122" y="112" fill="#0d2440" font-size="13">P</text>
    <text x="92" y="516" fill="#0d2440" font-size="14" font-weight="bold">K = 1</text>
    <text x="80" y="536" fill="#0d2440" font-size="12">Le = L</text>
    <text x="72" y="556" fill="#b64a2a" font-size="12">Pcr = π²EI/L²</text>
    <text x="76" y="580" fill="#0d2440" font-size="11">articulada-articulada</text>
  </g>

  <!-- Caso 2: empotrada-libre K=2 -->
  <g>
    <path d="M 320 480 Q 322 380 355 200" fill="none" stroke="#b64a2a" stroke-width="3"/>
    <line x1="320" y1="480" x2="320" y2="200" stroke="#0d2440" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="298" y="480" width="44" height="10" fill="#0d2440"/>
    <path d="M 355 170 l -7 14 h 14 z" fill="#0d2440"/>
    <line x1="355" y1="140" x2="355" y2="170" stroke="#0d2440" stroke-width="2"/>
    <text x="347" y="132" fill="#0d2440" font-size="13">P</text>
    <text x="292" y="516" fill="#0d2440" font-size="14" font-weight="bold">K = 2</text>
    <text x="280" y="536" fill="#0d2440" font-size="12">Le = 2L</text>
    <text x="264" y="556" fill="#b64a2a" font-size="12">Pcr = π²EI/4L²</text>
    <text x="280" y="580" fill="#0d2440" font-size="11">empotrada-libre</text>
    <text x="252" y="600" fill="#b64a2a" font-size="11">⚠ la más débil (¼)</text>
  </g>

  <!-- Caso 3: empotrada-articulada K=0.7 -->
  <g>
    <path d="M 530 480 C 530 420 565 340 530 180" fill="none" stroke="#b64a2a" stroke-width="3"/>
    <line x1="530" y1="480" x2="530" y2="180" stroke="#0d2440" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="508" y="480" width="44" height="10" fill="#0d2440"/>
    <circle cx="530" cy="180" r="6" fill="#f7f0d9" stroke="#0d2440" stroke-width="2"/>
    <path d="M 530 150 l -7 14 h 14 z" fill="#0d2440"/>
    <line x1="530" y1="120" x2="530" y2="150" stroke="#0d2440" stroke-width="2"/>
    <text x="522" y="112" fill="#0d2440" font-size="13">P</text>
    <text x="484" y="516" fill="#0d2440" font-size="14" font-weight="bold">K = 0.7</text>
    <text x="476" y="536" fill="#0d2440" font-size="12">Le = 0.7L</text>
    <text x="458" y="556" fill="#b64a2a" font-size="12">Pcr ≈ 2·π²EI/L²</text>
    <text x="464" y="580" fill="#0d2440" font-size="11">empotrada-articulada</text>
  </g>

  <!-- Caso 4: biempotrada K=0.5 -->
  <g>
    <path d="M 720 480 C 720 430 755 400 737 330 C 720 270 720 230 720 180" fill="none" stroke="#b64a2a" stroke-width="3"/>
    <line x1="720" y1="480" x2="720" y2="180" stroke="#0d2440" stroke-width="1" stroke-dasharray="4 4"/>
    <rect x="698" y="480" width="44" height="10" fill="#0d2440"/>
    <rect x="698" y="170" width="44" height="10" fill="#0d2440"/>
    <path d="M 720 140 l -7 14 h 14 z" fill="#0d2440"/>
    <line x1="720" y1="110" x2="720" y2="140" stroke="#0d2440" stroke-width="2"/>
    <text x="712" y="102" fill="#0d2440" font-size="13">P</text>
    <text x="674" y="516" fill="#0d2440" font-size="14" font-weight="bold">K = 0.5</text>
    <text x="666" y="536" fill="#0d2440" font-size="12">Le = 0.5L</text>
    <text x="648" y="556" fill="#b64a2a" font-size="12">Pcr = 4·π²EI/L²</text>
    <text x="672" y="580" fill="#0d2440" font-size="11">biempotrada</text>
    <text x="650" y="600" fill="#b64a2a" font-size="11">✓ la más rígida (×4)</text>
  </g>

  <!-- nota inferior -->
  <rect x="30" y="76" width="800" height="1" fill="#0d2440" opacity="0.3"/>
  <text x="440" y="98" fill="#0d2440" font-size="12">I = inercia MÍNIMA de la sección (la pieza pandea en su plano débil) · válido si σcr = Pcr/A ≤ límite proporcional (esbeltez alta)</text>
</svg>
