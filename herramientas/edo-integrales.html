<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Newsreader",Georgia,serif;background:#f7f0d9;color:#0d2440;padding:1rem 1.2rem;max-width:880px;margin:0 auto;font-size:15px;line-height:1.55}
/* tabs */
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:.8rem}
.tab{padding:.38rem .85rem;border:1.5px solid #c8c7c0;border-radius:18px;cursor:pointer;font-size:.82rem;background:#fbf7e8;transition:all .14s;font-family:"Newsreader",Georgia,serif}
.tab.active{background:#0d2440;color:#fff;border-color:#0d2440}
/* header row */
.header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem;flex-wrap:wrap;gap:.5rem}
.level-btns{display:flex;gap:5px;align-items:center}
.lbtn{padding:.22rem .6rem;border-radius:10px;border:1.5px solid;font-size:.78rem;cursor:pointer;background:transparent;font-family:"Newsreader",Georgia,serif;transition:all .14s}
.lbtn[data-l="0"]{border-color:#888;color:#888}  .lbtn[data-l="0"].act{background:#888;color:#fff}
.lbtn[data-l="1"]{border-color:#2a7a2a;color:#2a7a2a}.lbtn[data-l="1"].act{background:#2a7a2a;color:#fff}
.lbtn[data-l="2"]{border-color:#a07000;color:#a07000}.lbtn[data-l="2"].act{background:#a07000;color:#fff}
.lbtn[data-l="3"]{border-color:#a02020;color:#a02020}.lbtn[data-l="3"].act{background:#a02020;color:#fff}
.progress-text{font-size:.78rem;color:#666}
/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:580px){.grid{grid-template-columns:1fr}}
/* card */
.card{border:1.5px solid #D9DBD5;border-radius:7px;background:#fbf7e8;transition:border-color .15s}
.card.done{border-color:#1F7A4D;background:#E1F2E8}
.card-head{padding:.65rem .85rem;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem;user-select:none}
.card-head:hover{background:#f5f4f0;border-radius:6px 6px 0 0}
.card-meta{display:flex;gap:.35rem;align-items:center;margin-bottom:.3rem;flex-wrap:wrap}
.bl1{font-size:.68rem;font-weight:700;padding:.1rem .38rem;border-radius:3px;background:#d4f0d4;color:#1a5a1a}
.bl2{font-size:.68rem;font-weight:700;padding:.1rem .38rem;border-radius:3px;background:#fde8b0;color:#6a4000}
.bl3{font-size:.68rem;font-weight:700;padding:.1rem .38rem;border-radius:3px;background:#fdd8d8;color:#6a1010}
.integral{font-size:.95rem;min-height:26px;line-height:1.7}
.chevron{font-size:.9rem;color:#888;flex-shrink:0;margin-top:3px;transition:transform .18s}
.card.open .chevron{transform:rotate(180deg)}
/* card body */
.card-body{display:none;padding:.65rem .85rem;border-top:1px solid #e8e7e0}
.card.open .card-body{display:block}
.signal{background:#f0efe8;border-left:3px solid #999;padding:.38rem .65rem;font-size:.8rem;margin-bottom:.7rem;border-radius:0 4px 4px 0}
.signal b{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:#888;display:block;margin-bottom:.1rem}
/* steps */
.step{display:flex;gap:.55rem;margin-bottom:.48rem;align-items:flex-start}
.step.hidden{display:none}
.sn{flex-shrink:0;width:19px;height:19px;border-radius:50%;background:#0d2440;color:#fff;font-size:.68rem;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:4px}
.sc{flex:1;font-size:.87rem;line-height:1.65}
.slabel{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#888;margin-bottom:.08rem}
.result-box{background:#eaf4ea;border:1.5px solid #4a8a4a;border-radius:4px;padding:.32rem .65rem;margin-top:.3rem;font-size:.92rem}
/* buttons */
.acts{display:flex;gap:.45rem;margin-top:.7rem;flex-wrap:wrap;align-items:center}
.btn{padding:.3rem .68rem;border:1.5px solid #0d2440;border-radius:4px;font-size:.8rem;cursor:pointer;background:transparent;font-family:"Newsreader",Georgia,serif;transition:all .14s}
.btn:hover{background:#f0efe8}
.btn-next{background:#b64a2a;border-color:#b64a2a;color:#fff}.btn-next:hover{background:#8A3519}
.btn-all{font-size:.78rem;color:#555;border-color:#c0bfb8}.btn-all:hover{background:#f0efe8}
.btn-done{background:#3a7a3a;color:#fff;border-color:#3a7a3a;font-size:.78rem}.btn-done:hover{background:#2a6a2a}
.btn-undo{color:#3a7a3a;border-color:#3a7a3a;font-size:.78rem}.btn-undo:hover{background:#eaf4ea}
.steps-left{font-size:.78rem;color:#888;margin-left:auto}
/* empty */
.empty{text-align:center;padding:2.5rem;color:#888;font-size:.9rem;grid-column:1/-1}
/* progress bar */
.pbar-wrap{background:#e0dfd8;height:4px;border-radius:2px;margin-bottom:.2rem}
.pbar{height:4px;background:#3a7a3a;border-radius:2px;transition:width .3s}
/* method title */
.method-desc{font-size:.8rem;color:#666;margin-bottom:.9rem;border-left:3px solid #c8c7c0;padding-left:.6rem}
.top-bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:.25rem}
.brand{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.14em;color:#b64a2a;border:1px solid #d9a28f;padding:2px 7px;border-radius:5px;margin-right:.4rem;vertical-align:middle}
.app-title{font-family:"Fraunces",Georgia,serif;font-size:1.15rem;font-weight:600;border-bottom:2px solid #0d2440;padding-bottom:.25rem;margin-bottom:.8rem}
.reset-btn{font-size:.75rem;color:#B0303E;cursor:pointer;border:none;background:transparent;font-family:"Newsreader",Georgia,serif;text-decoration:underline}
</style>

<script src="../assets/vendor/katex/katex.min.js"></script>
<script src="../assets/vendor/katex/auto-render.min.js"></script>
<script>
const METHODS = ['Sustitución','Por partes','Fracciones simples','Cuadrado completo'];

const METHOD_DESC = {
  'Sustitución': 'Señal: ves \\(f(x)\\cdot f\'(x)\\) — la derivada del argumento interno está presente. Cambio \\(t=f(x)\\).',
  'Por partes': 'Señal: producto de dos clases distintas. Regla ILATE: \\(u\\) = la función que aparece primero en I-L-A-T-E.',
  'Fracciones simples': 'Señal: racional \\(P/Q\\), grado\\,P < grado\\,Q, denominador factorizable sobre \\(\\mathbb{R}\\).',
  'Cuadrado completo': 'Señal: cuadrático en denominador con discriminante negativo. Completar cuadrado → forma \\(\\arctan\\).'
};

const EX = [
// ───────── SUSTITUCIÓN ─────────
{id:'S1',m:'Sustitución',lvl:1,
  int:'\\displaystyle\\int 2x\\,e^{x^2}\\,dx',
  sig:'\\(2x = (x^2)\'\\). Patrón \\(f(x)\\cdot f\'(x)\\) con \\(f=x^2\\).',
  steps:[
    {l:'Cambio de variable',b:'\\(t = x^2,\\quad dt = 2x\\,dx\\). El factor \\(2x\\,dx\\) se convierte en \\(dt\\) exactamente — no sobra nada.'},
    {l:'Integral en t',b:'\\(\\displaystyle\\int e^t\\,dt = e^t + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int 2x\\,e^{x^2}\\,dx = e^{x^2} + C\\)',r:true}
  ]},
{id:'S2',m:'Sustitución',lvl:1,
  int:'\\displaystyle\\int \\cos(3x+1)\\,dx',
  sig:'Argumento compuesto \\(3x+1\\). Derivada del argumento = 3 (constante, fácil de ajustar).',
  steps:[
    {l:'Cambio de variable',b:'\\(t=3x+1,\\; dt=3\\,dx \\implies dx = dt/3\\)'},
    {l:'Sustituir',b:'\\(\\displaystyle\\int \\cos(t)\\cdot\\frac{dt}{3} = \\frac{1}{3}\\int\\cos t\\,dt = \\frac{1}{3}\\sin t + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\cos(3x+1)\\,dx = \\frac{\\sin(3x+1)}{3} + C\\)',r:true}
  ]},
{id:'S3',m:'Sustitución',lvl:2,
  int:'\\displaystyle\\int \\frac{(\\ln x)^2}{x}\\,dx',
  sig:'\\(\\tfrac{1}{x} = (\\ln x)\'\\) y el resto es una potencia de \\(\\ln x\\): patrón \\(f(x)^n\\cdot f\'(x)\\).',
  steps:[
    {l:'Cambio de variable',b:'\\(t = \\ln x,\\quad dt = \\dfrac{dx}{x}\\). El factor \\(\\tfrac{dx}{x}\\) se convierte en \\(dt\\).'},
    {l:'Integral en t',b:'\\(\\displaystyle\\int t^2\\,dt = \\frac{t^3}{3} + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{(\\ln x)^2}{x}\\,dx = \\frac{(\\ln x)^3}{3} + C\\)',r:true}
  ]},
{id:'S4',m:'Sustitución',lvl:2,
  int:'\\displaystyle\\int \\frac{x}{x^2+1}\\,dx',
  sig:'Denominador \\(x^2+1\\), numerador \\(x\\). La derivada de \\(x^2+1\\) es \\(2x\\) — solo falta un factor 2.',
  steps:[
    {l:'Ajustar constante',b:'\\(\\displaystyle\\int\\frac{x}{x^2+1}dx = \\frac{1}{2}\\int\\frac{2x}{x^2+1}dx\\). Multiplicar y dividir por 2 para que el numerador sea exactamente la derivada del denominador.'},
    {l:'Cambio de variable',b:'\\(t = x^2+1,\\quad dt = 2x\\,dx\\)'},
    {l:'Integral en t',b:'\\(\\dfrac{1}{2}\\displaystyle\\int\\frac{dt}{t} = \\frac{1}{2}\\ln|t| + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{x}{x^2+1}dx = \\frac{1}{2}\\ln(x^2+1) + C\\)',r:true}
  ]},
{id:'S5',m:'Sustitución',lvl:3,
  int:'\\displaystyle\\int \\frac{e^x}{1+e^{2x}}\\,dx',
  sig:'Reescribir \\(e^{2x}=(e^x)^2\\). Si \\(u=e^x\\) el denominador \\(1+u^2\\) es forma arctan.',
  steps:[
    {l:'Reescribir',b:'\\(\\displaystyle\\int\\frac{e^x}{1+(e^x)^2}dx\\). El denominador tiene \\((e^x)^2\\), señal de arctan si \\(u=e^x\\).'},
    {l:'Cambio de variable',b:'\\(u = e^x,\\quad du = e^x\\,dx\\). El factor \\(e^x\\,dx\\) del numerador se convierte en \\(du\\) exactamente.'},
    {l:'Integral en u',b:'\\(\\displaystyle\\int\\frac{du}{1+u^2} = \\arctan(u) + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{e^x}{1+e^{2x}}dx = \\arctan(e^x) + C\\)',r:true}
  ]},
{id:'S6',m:'Sustitución',lvl:3,
  int:'\\displaystyle\\int \\frac{1}{x\\ln x}\\,dx',
  sig:'Reescribir como \\(\\tfrac{1}{\\ln x}\\cdot\\tfrac{1}{x}\\). El factor \\(\\tfrac{1}{x}\\) es \\((\\ln x)\'\\), oculto en el denominador.',
  steps:[
    {l:'Reescribir',b:'\\(\\displaystyle\\int\\frac{1}{x\\ln x}dx = \\int\\frac{1}{\\ln x}\\cdot\\frac{1}{x}dx\\). Ahora sí aparece \\(f(x)\\cdot f\'(x)\\) con \\(f=\\ln x\\).'},
    {l:'Cambio de variable',b:'\\(t = \\ln x,\\quad dt = \\dfrac{dx}{x}\\). El factor \\(\\tfrac{1}{x}dx = dt\\).'},
    {l:'Integral en t',b:'\\(\\displaystyle\\int\\frac{1}{t}dt = \\ln|t| + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{dx}{x\\ln x} = \\ln|\\ln x| + C\\)',r:true}
  ]},
// ───────── POR PARTES ─────────
{id:'P1',m:'Por partes',lvl:1,
  int:'\\displaystyle\\int x\\,e^x\\,dx',
  sig:'Algebraica \\(\\times\\) exponencial. ILATE: A antes que E → \\(u = x\\).',
  steps:[
    {l:'Elección',b:'\\(u = x \\implies du = dx\\). \\(\\;dv = e^x\\,dx \\implies v = e^x\\).'},
    {l:'Fórmula',b:'\\(\\displaystyle\\int x\\,e^x\\,dx = x\\cdot e^x - \\int e^x\\,dx = xe^x - e^x + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int x\\,e^x\\,dx = e^x(x-1) + C\\)',r:true}
  ]},
{id:'P2',m:'Por partes',lvl:1,
  int:'\\displaystyle\\int x\\cos x\\,dx',
  sig:'Algebraica \\(\\times\\) trigonométrica. ILATE: A antes que T → \\(u=x\\).',
  steps:[
    {l:'Elección',b:'\\(u=x \\implies du=dx\\). \\(\\;dv=\\cos x\\,dx \\implies v=\\sin x\\).'},
    {l:'Fórmula',b:'\\(x\\sin x - \\displaystyle\\int \\sin x\\,dx = x\\sin x + \\cos x + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int x\\cos x\\,dx = x\\sin x + \\cos x + C\\)',r:true}
  ]},
{id:'P3',m:'Por partes',lvl:2,
  int:'\\displaystyle\\int x^2\\ln x\\,dx',
  sig:'Logaritmo \\(\\times\\) algebraica. ILATE: L antes que A → \\(u=\\ln x\\). Tentación: \\(u=x^2\\).',
  steps:[
    {l:'Por qué u = ln x',b:'Con \\(u=x^2\\) haría falta una primitiva de \\(\\ln x\\), que ya pide otra integración por partes. Con \\(u=\\ln x\\), \\(du=\\tfrac{dx}{x}\\) simplifica la potencia.'},
    {l:'Elección',b:'\\(u=\\ln x \\implies du=\\tfrac{1}{x}dx\\). \\(\\;dv=x^2\\,dx \\implies v=\\tfrac{x^3}{3}\\).'},
    {l:'Fórmula',b:'\\(\\dfrac{x^3}{3}\\ln x - \\displaystyle\\int\\frac{x^3}{3}\\cdot\\frac{1}{x}dx = \\frac{x^3}{3}\\ln x - \\frac{1}{3}\\int x^2\\,dx\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int x^2\\ln x\\,dx = \\frac{x^3}{3}\\ln x - \\frac{x^3}{9} + C\\)',r:true}
  ]},
{id:'P4',m:'Por partes',lvl:2,
  int:'\\displaystyle\\int \\ln x\\,dx',
  sig:'Solo logaritmo. Truco: escribir \\(\\ln x = \\ln x\\cdot 1\\). ILATE: L antes que A → \\(u=\\ln x\\), \\(dv=dx\\).',
  steps:[
    {l:'Truco clave',b:'No hay producto obvio, pero \\(\\int\\ln x\\,dx = \\int(\\ln x)\\cdot 1\\,dx\\). Ahora sí aplica por partes.'},
    {l:'Elección',b:'\\(u=\\ln x \\implies du=\\tfrac{1}{x}dx\\). \\(\\;dv=dx \\implies v=x\\).'},
    {l:'Fórmula',b:'\\(x\\ln x - \\displaystyle\\int x\\cdot\\frac{1}{x}dx = x\\ln x - \\int 1\\,dx = x\\ln x - x + C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\ln x\\,dx = x(\\ln x - 1) + C\\)',r:true}
  ]},
{id:'P5',m:'Por partes',lvl:3,
  int:'\\displaystyle\\int x^2 e^{-x}\\,dx',
  sig:'Polinomio de grado 2 \\(\\times\\) exponencial → tres rondas de por partes. El método tabular las hace de una vez.',
  steps:[
    {l:'Tabla',b:'Derivadas de \\(x^2\\): \\(x^2,\\; 2x,\\; 2,\\; 0\\). Primitivas sucesivas de \\(e^{-x}\\): \\(-e^{-x},\\; e^{-x},\\; -e^{-x}\\). Signos alternos: \\(+,-,+\\).'},
    {l:'Combinar en diagonal',b:'\\(x^2\\cdot(-e^{-x})\\;-\\;2x\\cdot e^{-x}\\;+\\;2\\cdot(-e^{-x})\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int x^2 e^{-x}\\,dx = -(x^2+2x+2)\\,e^{-x} + C\\)',r:true}
  ]},
{id:'P6',m:'Por partes',lvl:3,
  int:'\\displaystyle\\int e^x\\sin x\\,dx',
  sig:'Exponencial \\(\\times\\) trigonométrica. Por partes dos veces → la integral reaparece. Despejar \\(I\\).',
  steps:[
    {l:'Primera ronda',b:'\\(u=\\sin x,\\;dv=e^x dx\\): \\(\\;I = e^x\\sin x - \\displaystyle\\int e^x\\cos x\\,dx\\)'},
    {l:'Segunda ronda',b:'\\(u=\\cos x,\\;dv=e^x dx\\): \\(\\;\\int e^x\\cos x\\,dx = e^x\\cos x + \\int e^x\\sin x\\,dx = e^x\\cos x + I\\)'},
    {l:'Sustituir',b:'\\(I = e^x\\sin x - (e^x\\cos x + I) = e^x(\\sin x - \\cos x) - I\\)'},
    {l:'Despejar I',b:'\\(2I = e^x(\\sin x - \\cos x)\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int e^x\\sin x\\,dx = \\frac{e^x(\\sin x - \\cos x)}{2} + C\\)',r:true}
  ]},
// ───────── FRACCIONES SIMPLES ─────────
{id:'F1',m:'Fracciones simples',lvl:1,
  int:'\\displaystyle\\int \\frac{dx}{(x+1)(x-1)}',
  sig:'Denominador ya factorizado, dos raíces simples distintas \\(x=-1\\) y \\(x=1\\).',
  steps:[
    {l:'Descomposición',b:'\\(\\dfrac{1}{(x+1)(x-1)} = \\dfrac{A}{x+1}+\\dfrac{B}{x-1}\\). Multiplicar por el denominador: \\(1 = A(x-1)+B(x+1)\\).'},
    {l:'Calcular A, B',b:'\\(x=-1\\!:\\; 1=-2A \\Rightarrow A=-\\tfrac{1}{2}\\).\\(\\quad x=1\\!:\\; 1=2B \\Rightarrow B=\\tfrac{1}{2}\\).'},
    {l:'Integrar',b:'\\(\\displaystyle\\int\\!\\left[\\frac{-1/2}{x+1}+\\frac{1/2}{x-1}\\right]dx = -\\frac{1}{2}\\ln|x+1|+\\frac{1}{2}\\ln|x-1|+C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{dx}{(x+1)(x-1)} = \\frac{1}{2}\\ln\\left|\\frac{x-1}{x+1}\\right| + C\\)',r:true}
  ]},
{id:'F2',m:'Fracciones simples',lvl:2,
  int:'\\displaystyle\\int \\frac{dx}{x(x-1)}',
  sig:'Dos raíces simples, una en \\(x=0\\). Cuidado: \\(A/x\\) con raíz en 0 sigue siendo una fracción simple válida.',
  steps:[
    {l:'Descomposición',b:'\\(\\dfrac{1}{x(x-1)} = \\dfrac{A}{x}+\\dfrac{B}{x-1}\\). Así: \\(1 = A(x-1)+Bx\\).'},
    {l:'Calcular A, B',b:'\\(x=0\\!:\\; 1=-A \\Rightarrow A=-1\\).\\(\\quad x=1\\!:\\; 1=B \\Rightarrow B=1\\).'},
    {l:'Integrar',b:'\\(\\displaystyle\\int\\!\\left[\\frac{-1}{x}+\\frac{1}{x-1}\\right]dx = -\\ln|x|+\\ln|x-1|+C\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{dx}{x(x-1)} = \\ln\\left|\\frac{x-1}{x}\\right| + C\\)',r:true}
  ]},
{id:'F3',m:'Fracciones simples',lvl:3,
  int:'\\displaystyle\\int \\frac{x+2}{x(x^2+4)}\\,dx',
  sig:'Factor lineal \\(x\\) y cuadrático irreducible \\(x^2+4\\). Dos tipos de fracción: \\(A/x\\) y \\((Bx+C)/(x^2+4)\\).',
  steps:[
    {l:'Descomposición',b:'\\(\\dfrac{x+2}{x(x^2+4)} = \\dfrac{A}{x}+\\dfrac{Bx+C}{x^2+4}\\). Multiplicar: \\(x+2 = A(x^2+4)+(Bx+C)x\\).'},
    {l:'Calcular coeficientes',b:'\\(x=0\\): \\(2=4A \\Rightarrow A=\\tfrac12\\). Coef. de \\(x^2\\): \\(0=A+B \\Rightarrow B=-\\tfrac12\\). Coef. de \\(x\\): \\(1=C\\).'},
    {l:'Integrar',b:'\\(\\displaystyle\\int\\!\\left[\\frac{1/2}{x}+\\frac{-x/2+1}{x^2+4}\\right]dx\\)'},
    {l:'Cada término',b:'\\(-\\tfrac12\\int\\tfrac{x}{x^2+4}dx = -\\tfrac14\\ln(x^2+4)\\) (forma \\(f\'/f\\)). \\(\\;\\int\\tfrac{dx}{x^2+4} = \\tfrac12\\arctan\\tfrac{x}{2}\\).'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{x+2}{x(x^2+4)}dx = \\frac{1}{2}\\ln|x| - \\frac{1}{4}\\ln(x^2+4) + \\frac{1}{2}\\arctan\\frac{x}{2} + C\\)',r:true}
  ]},
{id:'F4',m:'Fracciones simples',lvl:3,
  int:'\\displaystyle\\int \\frac{u+1}{(u-1)^2}\\,du',
  sig:'Raíz doble en \\(u=1\\). Descomposición: \\(A/(u-1)+B/(u-1)^2\\). Dos fracciones para una raíz doble.',
  steps:[
    {l:'Descomposición',b:'\\(\\dfrac{u+1}{(u-1)^2} = \\dfrac{A}{u-1}+\\dfrac{B}{(u-1)^2}\\). Multiplicar: \\(u+1=A(u-1)+B\\).'},
    {l:'Calcular A, B',b:'\\(u=1\\): \\(2=B\\). Coef \\(u\\): \\(1=A\\). Luego \\(A=1,\\;B=2\\).'},
    {l:'Integrar',b:'\\(\\displaystyle\\int\\!\\left[\\frac{1}{u-1}+\\frac{2}{(u-1)^2}\\right]du\\)'},
    {l:'Cada término',b:'\\(\\int\\tfrac{1}{u-1}du = \\ln|u-1|\\). \\(\\quad\\int\\tfrac{2}{(u-1)^2}du = 2\\cdot\\tfrac{(u-1)^{-1}}{-1} = \\tfrac{-2}{u-1}\\).'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{u+1}{(u-1)^2}du = \\ln|u-1| - \\frac{2}{u-1} + C\\)',r:true}
  ]},
{id:'F5',m:'Fracciones simples',lvl:3,
  int:'\\displaystyle\\int \\frac{2x+1}{x(x+1)^2}\\,dx',
  sig:'Raíz simple \\(x=0\\) y raíz doble \\(x=-1\\). Tres fracciones: \\(A/x\\;+\\;B/(x+1)\\;+\\;C/(x+1)^2\\).',
  steps:[
    {l:'Descomposición',b:'\\(2x+1 = A(x+1)^2+Bx(x+1)+Cx\\).'},
    {l:'Calcular A, B, C',b:'\\(x=0\\): \\(1=A\\). \\(x=-1\\): \\(-1=-C \\Rightarrow C=1\\). Coef \\(x^2\\): \\(0=A+B \\Rightarrow B=-1\\).'},
    {l:'Integrar',b:'\\(\\displaystyle\\int\\!\\left[\\frac{1}{x}-\\frac{1}{x+1}+\\frac{1}{(x+1)^2}\\right]dx\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{2x+1}{x(x+1)^2}dx = \\ln|x|-\\ln|x+1|-\\frac{1}{x+1}+C = \\ln\\!\\left|\\frac{x}{x+1}\\right|-\\frac{1}{x+1}+C\\)',r:true}
  ]},
// ───────── CUADRADO COMPLETO ─────────
{id:'C1',m:'Cuadrado completo',lvl:1,
  int:'\\displaystyle\\int \\frac{dx}{x^2+9}',
  sig:'Denominador ya en forma \\(x^2+a^2\\) con \\(a^2=9\\), \\(a=3\\). Fórmula arctan directa.',
  steps:[
    {l:'Fórmula',b:'\\(\\displaystyle\\int\\frac{dx}{x^2+a^2} = \\frac{1}{a}\\arctan\\frac{x}{a}+C\\)'},
    {l:'Aplicar con a=3',b:'\\(\\displaystyle\\int\\frac{dx}{x^2+9} = \\frac{1}{3}\\arctan\\frac{x}{3}+C\\)',r:true}
  ]},
{id:'C2',m:'Cuadrado completo',lvl:2,
  int:'\\displaystyle\\int \\frac{dx}{x^2+2x+10}',
  sig:'Discriminante \\(\\Delta=4-40=-36<0\\) → no factoriza sobre \\(\\mathbb{R}\\) → completar el cuadrado.',
  steps:[
    {l:'Por qué no fracciones simples',b:'\\(\\Delta = b^2-4c = 4-40 = -36 < 0\\). Sin raíces reales no hay factores lineales que separar.'},
    {l:'Completar el cuadrado',b:'Mitad del coeficiente de \\(x\\): \\(1\\); \\(1^2=1\\). Sumar y restar 1:\\[(x^2+2x+1)+9 = (x+1)^2+9\\]'},
    {l:'Cambio de variable',b:'\\(u=x+1,\\;du=dx\\). Queda \\(\\displaystyle\\int\\frac{du}{u^2+9}\\) con \\(a=3\\).'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{dx}{x^2+2x+10} = \\frac{1}{3}\\arctan\\frac{x+1}{3}+C\\)',r:true}
  ]},
{id:'C3',m:'Cuadrado completo',lvl:2,
  int:'\\displaystyle\\int \\frac{dx}{x^2+4x+8}',
  sig:'Cuadrático, \\(\\Delta=16-32=-16<0\\). Completar el cuadrado.',
  steps:[
    {l:'Completar el cuadrado',b:'\\(x^2+4x+8\\). Mitad de \\(4\\) es \\(2\\); \\(2^2=4\\). \\((x^2+4x+4)+4=(x+2)^2+4\\).'},
    {l:'Cambio de variable',b:'\\(u=x+2,\\;du=dx\\). \\(\\displaystyle\\int\\frac{du}{u^2+4}\\) con \\(a=2\\).'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{dx}{x^2+4x+8} = \\frac{1}{2}\\arctan\\frac{x+2}{2}+C\\)',r:true}
  ]},
{id:'C4',m:'Cuadrado completo',lvl:3,
  int:'\\displaystyle\\int \\frac{x+3}{x^2-2x+5}\\,dx',
  sig:'Numerador lineal \\(x+3\\). Manipular para que sea múltiplo de \\((x^2-2x+5)\'\\) más un resto constante.',
  steps:[
    {l:'Derivada del denominador',b:'\\((x^2-2x+5)\'=2x-2\\). Quiero escribir \\(x+3 = k(2x-2)+r\\). Igualando coef de \\(x\\): \\(1=2k \\Rightarrow k=\\tfrac{1}{2}\\). Término independiente: \\(3=-2k+r=-1+r \\Rightarrow r=4\\).'},
    {l:'Separar en dos integrales',b:'\\(\\displaystyle\\int\\frac{x+3}{x^2-2x+5}dx = \\frac{1}{2}\\int\\frac{2x-2}{x^2-2x+5}dx + 4\\int\\frac{dx}{x^2-2x+5}\\)'},
    {l:'Primera integral',b:'Forma \\(f\'/f\\): \\(\\displaystyle\\frac{1}{2}\\int\\frac{(x^2-2x+5)\'}{x^2-2x+5}dx = \\frac{1}{2}\\ln(x^2-2x+5)+C_1\\)'},
    {l:'Segunda integral',b:'\\(x^2-2x+5=(x-1)^2+4\\), \\(a=2\\): \\(\\;4\\cdot\\dfrac{1}{2}\\arctan\\dfrac{x-1}{2} = 2\\arctan\\dfrac{x-1}{2}\\)'},
    {l:'Resultado',b:'\\(\\displaystyle\\int\\frac{x+3}{x^2-2x+5}dx = \\frac{1}{2}\\ln(x^2-2x+5)+2\\arctan\\frac{x-1}{2}+C\\)',r:true}
  ]}
];

// State
let curMethod = 'Sustitución';
let curLevel = 0;
let revealed = {};  // id -> number of steps revealed
let done = new Set();
try{ done = new Set(JSON.parse(localStorage.getItem('palanca:edo-integrales:dominados')||'[]')); }catch(e){}
let open = new Set();

function saveDone(){try{localStorage.setItem('palanca:edo-integrales:dominados',JSON.stringify([...done]));}catch(e){}}

function renderMath(el){
  if(window.renderMathInElement){
    renderMathInElement(el,{delimiters:[
      {left:'\\(',right:'\\)',display:false},
      {left:'\\[',right:'\\]',display:true},
      {left:'\\displaystyle',right:'\\displaystyle',display:false}
    ],throwOnError:false});
  }
}

function buildTabs(){
  const c = document.getElementById('tabs');
  METHODS.forEach(m=>{
    const b = document.createElement('button');
    b.className='tab'+(m===curMethod?' active':'');
    b.textContent=m;
    b.onclick=()=>{curMethod=m;buildAll();};
    c.appendChild(b);
  });
}

function setLevel(l){
  curLevel=l;
  document.querySelectorAll('.lbtn').forEach(b=>{
    b.classList.toggle('act', +b.dataset.l===l);
  });
  buildGrid();
}

function buildAll(){
  document.querySelectorAll('.tab').forEach(b=>{
    b.classList.toggle('active', b.textContent===curMethod);
  });
  const desc = document.getElementById('method-desc');
  desc.innerHTML = METHOD_DESC[curMethod]||'';
  renderMath(desc);
  buildGrid();
}

function buildGrid(){
  const g = document.getElementById('grid');
  g.innerHTML='';
  const exs = EX.filter(e=>e.m===curMethod && (curLevel===0||e.lvl===curLevel));
  if(!exs.length){
    g.innerHTML='<div class="empty">No hay ejercicios en este nivel.</div>';
    return;
  }
  exs.forEach(e=>g.appendChild(buildCard(e)));
  updateProgress();
  renderMath(g);
}

function buildCard(e){
  const isOpen = open.has(e.id);
  const isDone = done.has(e.id);
  const rev = revealed[e.id]||0;
  const div = document.createElement('div');
  div.className='card'+(isOpen?' open':'')+(isDone?' done':'');
  div.id='card-'+e.id;

  // level badge
  const lbadge = `<span class="bl${e.lvl}">L${e.lvl}</span>`;

  // header
  const head = document.createElement('div');
  head.className='card-head';
  head.innerHTML=`<div style="flex:1;min-width:0">
    <div class="card-meta">${lbadge}</div>
    <div class="integral">\\(${e.int}\\)</div>
  </div><span class="chevron">▾</span>`;
  head.onclick=()=>toggleCard(e.id);
  div.appendChild(head);

  // body
  const body = document.createElement('div');
  body.className='card-body';
  body.id='body-'+e.id;

  // signal
  body.innerHTML=`<div class="signal"><b>Señal de reconocimiento</b>${e.sig}</div>`;

  // steps
  const stepList = document.createElement('div');
  e.steps.forEach((s,i)=>{
    const sd = document.createElement('div');
    sd.className='step'+(i>=rev?' hidden':'');
    sd.id=`step-${e.id}-${i}`;
    sd.innerHTML=`<div class="sn">${i+1}</div><div class="sc"><div class="slabel">${s.l}</div><div>${s.b}</div>${s.r?'<div class="result-box">'+s.b+'</div>':''}</div>`;
    // Note: result shown in result-box too
    if(s.r){
      sd.innerHTML=`<div class="sn">${i+1}</div><div class="sc"><div class="slabel">${s.l}</div><div class="result-box">${s.b}</div></div>`;
    }
    stepList.appendChild(sd);
  });
  body.appendChild(stepList);

  // actions
  const acts = document.createElement('div');
  acts.className='acts';
  acts.id='acts-'+e.id;
  body.appendChild(acts);
  div.appendChild(body);
  refreshActs(e,acts,rev,isDone);
  return div;
}

function refreshActs(e,actsEl,rev,isDone){
  actsEl.innerHTML='';
  const total = e.steps.length;
  if(!isDone){
    if(rev < total){
      const nb = document.createElement('button');
      nb.className='btn btn-next';
      nb.textContent = rev===0 ? 'Ver señal → paso 1' : (rev<total-1 ? `Paso ${rev+1} →` : 'Ver resultado');
      nb.onclick=()=>revealNext(e.id);
      actsEl.appendChild(nb);
    }
    if(rev > 0 && rev < total){
      const ab = document.createElement('button');
      ab.className='btn btn-all';
      ab.textContent='Ver todo';
      ab.onclick=()=>revealAll(e.id);
      actsEl.appendChild(ab);
    }
    if(rev===total){
      const db = document.createElement('button');
      db.className='btn btn-done';
      db.textContent='✓ Marcar como dominado';
      db.onclick=()=>markDone(e.id,true);
      actsEl.appendChild(db);
    }
    if(rev>0){
      const sl = document.createElement('span');
      sl.className='steps-left';
      sl.textContent=`${rev}/${total}`;
      actsEl.appendChild(sl);
    }
  } else {
    const ub = document.createElement('button');
    ub.className='btn btn-undo';
    ub.textContent='↺ Repetir';
    ub.onclick=()=>markDone(e.id,false);
    actsEl.appendChild(ub);
  }
}

function toggleCard(id){
  if(open.has(id)) open.delete(id); else open.add(id);
  const card = document.getElementById('card-'+id);
  card.classList.toggle('open');
}

function revealNext(id){
  const e = EX.find(x=>x.id===id);
  const rev = (revealed[id]||0)+1;
  revealed[id]=rev;
  // show step
  const stepEl = document.getElementById(`step-${id}-${rev-1}`);
  if(stepEl){ stepEl.classList.remove('hidden'); renderMath(stepEl); }
  // refresh acts
  const actsEl = document.getElementById('acts-'+id);
  refreshActs(e, actsEl, rev, done.has(id));
  renderMath(actsEl);
}

function revealAll(id){
  const e = EX.find(x=>x.id===id);
  const total = e.steps.length;
  for(let i=revealed[id]||0; i<total; i++){
    revealed[id]=i+1;
    const stepEl = document.getElementById(`step-${id}-${i}`);
    if(stepEl){ stepEl.classList.remove('hidden'); renderMath(stepEl); }
  }
  const actsEl = document.getElementById('acts-'+id);
  refreshActs(e, actsEl, total, done.has(id));
  renderMath(actsEl);
}

function markDone(id, isDone){
  if(isDone) done.add(id); else { done.delete(id); revealed[id]=0; }
  saveDone();
  // rebuild card
  const card = document.getElementById('card-'+id);
  if(!card) return;
  const wasOpen = card.classList.contains('open');
  const e = EX.find(x=>x.id===id);
  const newCard = buildCard(e);
  if(wasOpen) newCard.classList.add('open');
  card.replaceWith(newCard);
  renderMath(newCard);
  updateProgress();
}

function updateProgress(){
  const total = EX.length;
  const n = [...done].filter(id => EX.find(e=>e.id===id)).length;
  document.getElementById('ptext').textContent=`${n} / ${total} dominados`;
  document.getElementById('pbar').style.width=`${(n/total)*100}%`;
}

function resetAll(){
  if(!confirm('¿Reiniciar todo el progreso?')) return;
  done.clear(); revealed={};
  saveDone();
  buildGrid();
}

// Init
buildTabs();
buildAll();
updateProgress();
</script>
</body>
</html>
